name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ITHelpdeskSystem.slnx

      - name: Build
        run: dotnet build ITHelpdeskSystem.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ITHelpdeskSystem.slnx --no-build --configuration Release --verbosity normal
